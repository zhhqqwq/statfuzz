name: Performance Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/**"
      - "docs/BENCHMARKING.md"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install StatFuzz
        run: python -m pip install -e .

      - name: Record runner CPU metadata
        run: |
          echo "### CPU" >> "$GITHUB_STEP_SUMMARY"
          lscpu >> "$GITHUB_STEP_SUMMARY"

      - name: Run canonical baseline matrix
        run: |
          python benchmarks/performance_baseline.py \
            --json-out benchmark-results.json \
            --markdown-out benchmark-results.md

      - name: Show benchmark baseline
        run: |
          cat benchmark-results.md
          cat benchmark-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Show machine-readable baseline
        run: cat benchmark-results.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: statfuzz-performance-baseline
          path: |
            benchmark-results.json
            benchmark-results.md
          if-no-files-found: error
