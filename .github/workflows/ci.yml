name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install release tooling
        run: python -m pip install ".[release]"
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Clean install wheel
        run: |
          python -m venv .venv-release-wheel
          .venv-release-wheel/bin/python -m pip install --upgrade pip
          .venv-release-wheel/bin/python -m pip install dist/*.whl pytest
          .venv-release-wheel/bin/python scripts/release_smoke.py
      - name: Test installed wheel
        run: .venv-release-wheel/bin/python -m pytest tests
      - name: Clean install sdist
        run: |
          python -m venv .venv-release-sdist
          .venv-release-sdist/bin/python -m pip install --upgrade pip
          .venv-release-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-release-sdist/bin/python scripts/release_smoke.py
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: statfuzz-dist
          path: dist/*
          if-no-files-found: error
